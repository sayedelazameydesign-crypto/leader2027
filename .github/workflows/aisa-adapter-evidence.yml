# AIsa — دليل runtime لخط الأنابيب المحكوم (celia/adapters/aisa/pipeline.ts: كل نداء عبر بوابة NEXA قبل الشبكة) + حكم NEXA (bridge.ts).
#
# خط الأنابيب: connect → authenticate → search → get_details → validate → price-cap → (المرشحون يُقدَّمون للبوابة ⇒ DENIED) → evidence.
# لا `use` مدفوع إطلاقًا؛ الاستثناء المُسمّى الوحيد `use(account)` (مجاني، قراءة‑فقط) للقطة محاسبية قبل/بعد.
# السرّ: AISA_API_KEY من GitHub > Settings > Secrets > Actions (مفتاح CI مخصّص بسقف إنفاق منخفض) — لا يمرّ عبر أي محادثة.
# القراءة من بيئة التطوير:  gh api repos/<owner>/<repo>/check-runs/<job_id>/annotations
name: "AIsa adapter evidence (read-only)"

on:
  workflow_dispatch:
    inputs:
      query:
        description: "وصف المهمة بلغة طبيعية لـsearch"
        required: false
        default: "extract the readable text content of a public documentation web page given its URL"
        type: string
      category:
        description: "تقييد البحث بفئة (seo|finance|social|search|sales|mail) — فارغ = الكل"
        required: false
        default: "search"
        type: string
      max_price_usd:
        description: "سقف السياسة بالدولار لقرار الاقتراح (لا تنفيذ على أي حال)"
        required: false
        default: "0.01"
        type: string
  push:
    branches: [arena/01a0e068-leader2027]
    paths:
      - ".github/workflows/aisa-adapter-evidence.yml"
      - "celia/**"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # ≥ 22.18: type stripping افتراضيًا — لا build ولا تبعيات

      - name: "Secret presence (name only)"
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
        run: |
          if [ -n "$AISA_API_KEY" ]; then echo "::notice title=secrets::AISA_API_KEY = present"; else echo "::notice title=secrets::AISA_API_KEY = absent"; fi

      - name: "NEXA gateway: connect / authenticate / search / get_details / validate / price-cap / evidence"
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          QUERY: ${{ inputs.query || 'extract the readable text content of a public documentation web page given its URL' }}
          CATEGORY: ${{ inputs.category || 'search' }}
          MAX_PRICE_USD: ${{ inputs.max_price_usd || '0.01' }}
        run: |
          node celia/adapters/aisa/pipeline.ts \
            --query "$QUERY" ${CATEGORY:+--category "$CATEGORY"} --limit 3 --max-price-usd "$MAX_PRICE_USD" --autofill --account-snapshot \
            --out /tmp/aisa-adapter-evidence.txt --json /tmp/aisa-adapter-evidence.json

      # NEXA bridge (Celia GEN-1): يستورد رسم دليل البوابة ويتحقق من سلسلته، يحكم بعقد النتيجة، ويحسب GEN1_GATE — لا شبكة، لا سرّ. الخروج 0 فقط عند COMPLETED.
      - name: "NEXA outcome contract + evidence graph"
        if: always()
        run: |
          if [ ! -f /tmp/aisa-adapter-evidence.json ]; then
            echo "::notice title=NEXA_OUTCOME::NEXA_OUTCOME=NOT_VERIFIED (adapter produced no JSON evidence)"; exit 1
          fi
          node celia/adapters/aisa/bridge.ts \
            --in /tmp/aisa-adapter-evidence.json --contract celia/adapters/aisa/contract.readonly.json \
            --graph /tmp/aisa-evidence-graph.jsonl --out /tmp/aisa-nexa.txt

      - name: "Job summary (redacted evidence)"
        if: always()
        run: |
          {
            echo "## AIsa adapter evidence (read-only) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '```text'
            cat /tmp/aisa-adapter-evidence.txt 2>/dev/null || echo "(no evidence file)"
            echo '```'
            echo "### NEXA verdict (Celia GEN-1 gateway)"
            echo '```text'
            cat /tmp/aisa-nexa.txt 2>/dev/null || echo "(no NEXA output)"
            echo '```'
            echo '<details><summary>evidence graph (JSONL, hash-chained)</summary>'
            echo
            echo '```text'
            cat /tmp/aisa-evidence-graph.jsonl 2>/dev/null || echo "(no graph)"
            echo '```'
            echo '</details>'
            echo '<details><summary>facts (JSON, redacted)</summary>'
            echo
            echo '```json'
            cat /tmp/aisa-adapter-evidence.json 2>/dev/null || echo "{}"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # سياق github مسموح في env على مستوى الوظيفة. أما `runner` فمسموح **في مستوى
      # الخطوة فقط** — وضعه هنا يفشل الترجمة قبل أي job:
      #   Invalid workflow file (Line 14, Col 20): Unrecognized named-value: 'runner'
      # ⇒ L27_DB_PATH (حاوية P1 المعزولة) معرَّف في env الخطوة الأخيرة.
      L27_CI_RUN: ${{ github.run_id }}-${{ github.run_number }}-${{ github.sha }}
      L27_SERVER_LOG: /tmp/leader2027-server.log
      # تنبيه مُقاس: **لا NODE_ENV هنا**. NODE_ENV=production على مستوى الوظيفة جعل
      # `npm ci` يتخطى devDependencies (محلياً: 27 حزمة فقط و`tsc: not found`؛ وفي CI
      # سقط typecheck بـ«no interface JSX.IntrinsicElements» لغياب @types/react).
      # لذلك NODE_ENV=production معرَّف في خطوتَي الخادم فقط (أسفله).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # P2 — إثبات سلوكي على خادم حقيقي (لا نص في README): next start على الإنتاج
      # بلا سرّ صالح لا يُقلع أصلاً — exit ≠ 0 + رسالة «رفض الإقلاع (fail-closed)».
      - name: "P2 fail-closed proof — next start refuses to boot without a valid L27_SESSION_SECRET"
        env:
          NODE_ENV: production
          # سرّ CI تجريبي (غير سري بطبيعته) — يُنزع في هذه الخطوة لإثبات الرفض
          L27_SESSION_SECRET: ci-only-secret-not-a-real-0123456789
        run: |
          set +e
          LOG=/tmp/l27-failclosed.log
          env -u L27_SESSION_SECRET PORT=3100 timeout 90 npm start > "$LOG" 2>&1 &
          SRV=$!
          sleep 12
          curl_code=0
          curl -s --max-time 5 -o /dev/null http://127.0.0.1:3100/api/health || curl_code=$?
          kill -0 "$SRV" 2>/dev/null && alive=yes || alive=no
          wait "$SRV"
          boot_code=$?
          # التشخيص منشور في job summary — تنزيل سجلات الخطوات غير متاح من بيئة
          # التشخيص الحالية (EOF من blob storage)، فالملخص هو قناة الإثبات البديلة.
          {
            echo "### P2 fail-closed proof — تشخيص مُقاس على الـrunner"
            echo '```text'
            echo "boot_exit=$boot_code curl_exit=$curl_code alive_after_12s=$alive"
            echo "node=$(node -v) npm=$(npm -v) shell=$BASH_VERSION"
            echo "NODE_ENV(step)=$NODE_ENV  L27_SESSION_SECRET في الخطوة معرّف؟ $([ -n "$L27_SESSION_SECRET" ] && echo yes || echo no)"
            echo "--- سجل الخادم المرفوض ($LOG) ---"
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "boot_exit=$boot_code curl_exit=$curl_code alive=$alive"
          ok=1
          [ "$boot_code" -ne 0 ] || { echo "::error::الخادم أقلع رغم غياب السرّ (boot_exit=0) — البوابة لم تُطبق"; ok=0; }
          [ "$curl_code" -ne 0 ] || { echo "::error::المنفذ 3100 استجاب رغم غياب السرّ — fail-open"; ok=0; }
          grep -q "fail-closed" "$LOG" || { echo "::error::رسالة الرفض (fail-closed) غير موجودة في سجل الخادم"; ok=0; }
          [ "$ok" -eq 1 ] || exit 1
          echo "P2 fail-closed: مُثبت على خادم حقيقي في CI"

      # P1 + إنتاج: خادم واحد بحاوية معزولة، وsmoke يُنفَّذ مرتين (34+34 فحصاً)
      # لإثبات الحتمية — أي اعتماد على حالة تشغيل سابق يُسقط الجولة الثانية.
      - name: "Production smoke (evidence AC1-16 on next start, isolated container, deterministic x2)"
        env:
          NODE_ENV: production
          L27_SESSION_SECRET: ci-only-secret-not-a-real-0123456789
          # P1 — حاوية بيانات معزولة وطازجة لكل تشغيل: خارج شجرة العمل (runner.temp)
          # فلا تتسرب حالة smoke بين الخطوات أو بين التشغيلات، وتبقى الفحوص الحتمية
          # («العدد قبل/بعد») صحيحة.
          L27_DB_PATH: ${{ runner.temp }}/l27-ci/db.json
        run: |
          node -e "console.log('[ci] L27_CI_RUN=' + process.env.L27_CI_RUN + ' L27_DB_PATH=' + process.env.L27_DB_PATH)"
          test ! -e "$L27_DB_PATH" && echo "الحاوية طازجة (لا db.json قبل الإقلاع)"
          npm start > "$L27_SERVER_LOG" 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null' EXIT
          npm run smoke
          echo "--- جولة ثانية على نفس الحاوية: إثبات الحتمية ---"
          npm run smoke
          echo "--- سجل الخادم (إثبات استهلاك الحاوية المعزولة) ---"
          head -5 "$L27_SERVER_LOG"
          test -s "$L27_DB_PATH"
          echo "الحاوية المعزولة مكتوبة: $(wc -c < "$L27_DB_PATH") bytes في $L27_DB_PATH"

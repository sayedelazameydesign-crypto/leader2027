name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: "Production smoke (evidence: AC1-11 on next start)"
        run: |
          npm start > /tmp/leader2027-server.log 2>&1 &
          npm run smoke
